services:
  - type: web
    name: smart-resume-analyzer
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn wsgi:app --workers 1 --threads 2 --bind 0.0.0.0:$PORT --timeout 120"
    healthCheckPath: /health
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_URL
        value: "sqlite:////tmp/app.db"
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: SECRET_KEY
        generateValue: true